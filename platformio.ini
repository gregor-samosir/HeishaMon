; PlatformIO project configuration for HeishaMon
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = HeishaMon
default_envs = esp8266

[env]
lib_deps =
    locoduino/RingBuffer
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    milesburton/DallasTemperature
    paulstoffregen/OneWire
    adafruit/Adafruit NeoPixel
build_flags =
    -Wall

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x4000
    -DMMU_SEC_HEAP=0x40108000
    -DMMU_SEC_HEAP_SIZE=0x4000
    -DVTABLES_IN_FLASH
    -DBEARSSL_SSL_BASIC
    -DLWIP_OPEN_SRC
    -DTCP_MSS=536
    -DLWIP_FEATURES=1
    -DLWIP_IPV6=0
upload_speed = 921600
monitor_speed = 115200

[env:esp32]
; The upstream platformio/platform-espressif32 is stuck on arduino-esp32 2.0.17.
; HeishaMon requires arduino-esp32 3.3.11 (matches the CI build), which is only
; available through the pioarduino community fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
monitor_speed = 115200
